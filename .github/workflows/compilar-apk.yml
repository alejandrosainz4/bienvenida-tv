name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        run: gradle --no-daemon assembleRelease

      - name: Preparar archivo
        run: cp app/build/outputs/apk/release/app-release.apk bienvenida-alexaventuras.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bienvenida-alexaventuras
          path: bienvenida-alexaventuras.apk

      # Publica el APK con una dirección fija para descargarlo desde la tele:
      # https://github.com/<usuario>/<repo>/releases/latest/download/bienvenida-alexaventuras.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: Bienvenida TV ${{ github.run_number }}
          files: bienvenida-alexaventuras.apk
          make_latest: true
